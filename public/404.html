<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>andrewhaines.me</title>
  <script>
    // GitHub Pages has no server-side rewrites, so a hard load or
    // refresh on a clean path like /projects 404s by default. This
    // re-encodes the path as a query string and redirects to the real
    // index.html, which decodes it back (see the script in index.html).
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + "/?/" +
      l.pathname.slice(1).replace(/&/g, "~and~") +
      (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
