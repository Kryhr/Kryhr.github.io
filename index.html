  <script>
    // Decodes the path the 404.html fallback re-encoded, restoring a
    // clean URL like /projects before the app ever mounts.
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) { return s.replace(/~and~/g, "&"); })
          .join("?");
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
